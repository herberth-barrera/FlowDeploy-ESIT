name: CI - Integracion Continua

on:
  push:
  pull_request:

jobs:
  validacion:
    name: Validacion del codigo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Preparar directorio de trabajo
        run: mkdir -p work

      - name: Pruebas
        run: npm test
        
      - name: Smoke test de la app
        run: npm run smoke
        

